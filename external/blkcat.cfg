# Saved changes are reloaded on the next frame. Booleans: true/false, 1/0,
# on/off, yes/no. Colours are RRGGBB hex. A missing file or key keeps the
# built-in default.

# box = 4 corners, full_box = whole rectangle
box                   = true
full_box              = false
esp_thickness         = 2
esp_outline           = true
esp_outline_thickness = 1
esp_skeleton          = true
name                  = true
health_bar            = true
health_text           = true
weapon                = true
distance              = true
head_circle           = true

# triggerbot: hotkey is an X11 keysym (32 = space). Delay/Hold/Next Shot are
# milliseconds, jitter is +/- a percentage when trigger_jitter_pct is true and
# +/- that many milliseconds when false.
triggerbot            = false
trigger_hotkey        = 32
trigger_delay         = 0
trigger_jitter        = 0
trigger_jitter_pct    = true
trigger_hold          = 30
trigger_hold_jitter   = 0
trigger_next          = 0

box_color             = FF8000
outline_color         = 000000
skeleton_color        = FF8000
head_circle_color     = FF8000
name_color            = FFFFFF
health_color          = 00FF00
health_text_color     = FFFFFF
weapon_color          = FFFFFF
distance_color        = FFFFFF
